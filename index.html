<style>:root{--bg:#06060d;--bg2:#0d0f1c;--card:rgba(20,22,40,.78);--line:rgba(140,160,255,.14);--tx:#e9ecff;--mut:#9aa1c7;--neo:#00e5ff;--mag:#ff2bd6;--lim:#b6ff3b;--gold:#ffd23f;--red:#ff4d6d;--ok:#2bff88;--r:16px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding:70px 0 96px}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,rgba(124,77,255,.22),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(0,229,255,.14),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(255,43,214,.12),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--neo)} button{font:inherit;color:inherit}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.2} h2{font-size:1.25rem} h3{font-size:1.05rem}
.app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:72px 14px calc(86px + var(--safe-b));max-width:1180px;margin:0 auto;width:100%}
.top{position:fixed;inset:0 0 auto 0;height:58px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(6,6,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.08em;font-size:1.15rem;background:linear-gradient(90deg,var(--neo),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(0,229,255,.45));text-decoration:none;white-space:nowrap}
.tchip{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.82rem}
.lv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:120px}
.lv b{font-size:.8rem;color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.5)}
.mini{width:120px;height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--neo),var(--mag));box-shadow:0 0 10px var(--neo)}
.flame{display:flex;align-items:center;gap:3px;font-weight:800;color:#ff9e3d;text-shadow:0 0 10px rgba(255,120,0,.6)}
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));background:rgba(8,8,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:.68rem;padding:4px 2px;border-radius:12px}
.tabs a span{display:block;font-size:1.25rem;line-height:1.2}
.tabs a.on{color:var(--neo);text-shadow:0 0 10px rgba(0,229,255,.7);background:rgba(0,229,255,.07)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card.glow{border-color:rgba(0,229,255,.35);box-shadow:0 0 0 1px rgba(0,229,255,.12),0 0 28px rgba(0,229,255,.12),0 10px 30px rgba(0,0,0,.4)}

ère fois, un juge spécialisé contrôle la constitutionnalité des lois. Le bicamérisme et la responsabilité du gouvernement existaient déjà.","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-9e46cb2f","k":"dc","q":"En 1958, quel mécanisme vise directement à maîtriser l’inflation des amendements et à encadrer la discussion parlementaire des textes ?","o":["Le mandat impératif","Le référendum d’initiative citoyenne","Le vote bloqué","Le droit de pétition"],"a":2,"e":"L’article 44 alinéa 3 (vote bloqué) permet au gouvernement d’obliger l’assemblée à se prononcer en un seul vote, en ne retenant que les amendements qu’il accepte.","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-5b0da006","k":"dc","q":"Quel est, en 1958, l’un des pouvoirs dispensés de contreseing ?","o":["La nomination des membres du Conseil constitutionnel (tous)","La dissolution de l’Assemblée nationale","La direction de la politique de la Nation","La fixation de l’ordre du jour des assemblées"],"a":1,"e":"La dissolution (article 12) est un pouvoir propre du président, dispensé de contreseing au titre de l’article 19. Le président ne nomme que 3 des 9 membres du Conseil constitutionnel, et c’est le Gouvernement qui conduit la politique de la Nation (art. 20).","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-100e3a7f","k":"dc","q":"Quel est le mode de légitimation populaire utilisé pour adopter la Constitution de 1958 ?","o":["Adoption par le Congrès uniquement","Adoption par ordonnances","Référendum","Vote unique du Sénat"],"a":2,"e":"Le texte est adopté par référendum le 28 septembre 1958 (environ 80 % de oui), ce qui lui confère une légitimité populaire directe au-delà de sa validité juridique.","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-fa53119e","k":"dc","q":"Avant 1958, quel type de régime caractérise principalement la IVe République ?","o":["Présidentiel","Parlementaire (à forte prééminence des assemblées)","Semi-présidentiel stabilisé","Directorial"],"a":1,"e":"Sous la IVe République, les assemblées dominent et les coalitions fragiles produisent une forte instabilité ministérielle (une vingtaine de gouvernements en douze ans).","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-8470f8e9","k":"dc","q":"Quel scrutin sert à élire le Président de la République lors de la première mise en place des institutions de la Ve République (1958) ?","o":["Suffrage universel direct","Suffrage universel indirect par un collège électoral élargi","Élection par l’Assemblée nationale seule","Référendum de désignation"],"a":1,"e":"De Gaulle est élu le 21 décembre 1958 au suffrage universel indirect par un collège d’environ 80 000 grands électeurs. Le suffrage universel direct n’arrive qu’avec la révision de 1962.","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-9fb1b7a5","k":"dc","q":"La loi constitutionnelle du 3 juin 1958 impose notamment que la future Constitution respecte :","o":["L’unicamérisme","L’élection du Président au suffrage universel direct dès 1958","La suppression du référendum","La responsabilité du Gouvernement devant le Parlement"],"a":3,"e":"Parmi les cinq principes de la loi du 3 juin 1958 figure la responsabilité du Gouvernement devant le Parlement : on reste donc dans un régime parlementaire, même si l’exécutif est renforcé.","s":"Prépa IPAG Nanterre · QCM 1 de droit constitutionnel (la naissance de 1958), cartes Anki","y":"IPAG 2026","t":"ipag"},{"id":"dc-533cf2a7","k":"dc","q":"Dans la construction de 1958, quel est l’intérêt politique du référendum au-de onseil des ministres ; le Parlement dispose de 70 jours."]],"annuel":false}],"course":{"titre":"La naissance de la Constitution de 1958","html":"<h2>La naissance de la Constitution de 1958<\/h2>\n<h3>1. Introduction<\/h3>\n<p>Salut, et bienvenue dans ce podcast de révision. Aujourd&#x27;hui, on va parler d&#x27;un sujet absolument central pour ta prépa et pour le concours des IRA : la naissance de la Constitution de 1958, autrement dit, la naissance de la Ve République.<\/p>\n<p>Installe-toi confortablement. L&#x27;objectif, ce n&#x27;est pas d&#x27;apprendre une liste de dates par cœur. L&#x27;objectif, c&#x27;est que tu comprennes la logique de toute cette histoire. Pourquoi on change de régime, comment le texte est écrit, et ce qu&#x27;il change concrètement dans le fonctionnement des institutions. Si tu comprends la logique, tu pourras répondre à n&#x27;importe quelle question, même formulée de façon inattendue.<\/p>\n<p>Voici le programme. D&#x27;abord, on verra pourquoi la IVe République s&#x27;effondre. Ensuite, la crise de mai et juin 1958. Puis la rédaction du texte, son adoption et l&#x27;installation des nouvelles institutions. Après ça, on entrera dans le cœur du sujet : le parlementarisme rationalisé, le partage entre la loi et le règlement, le rôle du Président, et le Conseil constitutionnel. Et on terminera par les pièges classiques, et un récap des dates clés.<\/p>\n<p>C&#x27;est parti.<\/p>\n<h3>2. Le point de départ : l&#x27;effondrement de la IVe République<\/h3>\n<p>Commençons par le point de départ. La IVe République dure de 1946 à 1958. C&#x27;est un régime parlementaire, mais un régime parlementaire où les assemblées dominent. On parle parfois de régime d&#x27;assemblée.<\/p>\n<p>Concrètement, qu&#x27;est-ce que ça veut dire ? Les gouvernements dépendent de coalitions fragiles, construites entre plusieurs partis. Et dès qu&#x27;un partenaire se retire, le gouvernement tombe. Résultat : une vingtaine de gouvernements en à peine douze ans. C&#x27;est ce qu&#x27;on appelle l&#x27;instabilité ministérielle. Retiens bien cette expression, elle revient tout le temps.<\/p>\n<p>À cette faiblesse institutionnelle s&#x27;ajoute une crise majeure : la guerre d&#x27;Algérie. Les dirigeants de la IVe République n&#x27;arrivent pas à la gérer. Le pouvoir est paralysé, et la tension monte, notamment dans l&#x27;armée.<\/p>\n<p class=\"recap\">Petit récap : un régime dominé par les assemblées, des gouvernements qui tombent sans arrêt, et une guerre d&#x27;Algérie que personne n&#x27;arrive à maîtriser. Tous les ingrédients d&#x27;une crise sont réunis.<\/p>\n<h3>3. La crise de mai et juin 1958<\/h3>\n<p>Passons maintenant à la crise elle-même.<\/p>\n<p>Tout commence le 13 mai 1958, à Alger. Des émeutes éclatent, et un Comité de salut public se forme, avec le soutien de militaires. C&#x27;est l&#x27;événement déclencheur de toute la séquence. Retiens donc : 13 mai, Alger.<\/p>\n<p>Face à cette situation, le pouvoir à Paris est complètement dépassé. Le président de la République, René Coty, fait alors appel au général de Gaulle. Et de Gaulle est investi président du Conseil le 1er juin 1958. Attention au vocabulaire : sous la IVe République, le chef du gouvernement s&#x27;appelle le président du Conseil.<\/p>\n<p>Deux jours plus tard, arrive un texte fondamental : la loi constitutionnelle du 3 juin 1958. C&#x27;est ce texte qui autorise le gouvernement du général de Gaulle à rédiger une nouvelle Constitution. Mais pas n&#x27;importe comment : la loi fixe cinq principes que la future Constitution devra obligatoirement respecter.<\/p>\n<p>Je te les donne un par un.<\/p>\n<p>Premier principe : le suffrage universel est la seule source du pouvoir.<\/p>\n<p>Deuxième principe : la séparation de l&#x27;exécutif et du législatif.<\/p>\n<p>IIIe principe : la responsabilité du Gouvernement devant le Parlement. Et c&#x27;est très important, parce que ça veut dire qu&#x27;on garde un régime parlementaire. On ne bascule pas vers un régime présidentiel à l&#x27;américaine.<\/p>\n<p>Quatrième principe : l&#x27;indépendance de l&#x27;autorité judiciaire.<\/p>\n<p>Et cinquième principe : l&#x27;organisation des rapports avec les peuples associés, c&#x27;est-à-dire l&#x27;outre-mer et l&#x27;empire colonial.<\/p>\n<p class=\"recap\">Récap rapide : 13 mai, émeutes à Alger. 1er juin, investiture de De Gaulle. 3 juin, la loi constitutionnelle qui l&#x27;autorise à écrire une nouvelle Constitution, avec cinq principes à respecter.<\/p>\n<h3>4. La rédaction du texte, été 1958<\/h3>\n<p>Pendant l&#x27;été 1958, le texte est rédigé.<\/p>\n<p>La plume principale, c&#x27;est Michel Debré, alors garde des Sceaux, c&#x27;est-à-dire ministre de la Justice. Il travaille avec un groupe d&#x27;experts, sous l&#x27;autorité du général de Gaulle.<\/p>\n<p>Deux organes vont donner leur avis sur le projet. Et là, il ne faut surtout pas les confondre.<\/p>\n<p>Le premier, c&#x27;est le Comité consultatif constitutionnel, qu&#x27;on abrège souvent en CCC. Il a été créé spécialement pour l&#x27;occasion, et il est composé surtout de parlementaires. Son rôle est purement consultatif.<\/p>\n<p>Le second, c&#x27;est le Conseil d&#x27;État, réuni en assemblée générale. Lui donne un avis juridique sur le texte.<\/p>\n<p>Et d&#x27;où viennent les idées de fond ? Il faut remonter au discours de Bayeux, prononcé par de Gaulle le 16 juin 1946. Dans ce discours, de Gaulle défendait déjà sa vision : un chef de l&#x27;État fort, placé au-dessus des partis, et un exécutif qui ne dépend pas des assemblées. Douze ans plus tard, cette vision devient la base de la nouvelle Constitution.<\/p>\n<p class=\"recap\">Récap : rédaction par Michel Debré, avis du Comité consultatif constitutionnel et du Conseil d&#x27;État en assemblée générale, et inspiration directe du discours de Bayeux de 1946.<\/p>\n<h3>5. L&#x27;adoption et l&#x27;installation des institutions<\/h3>\n<p>Le texte est prêt. Maintenant, il faut l&#x27;adopter.<\/p>\n<p>Le 28 septembre 1958, la Constitution est adoptée par référendum, avec environ 80 % de oui. C&#x27;est un score massif. Et au-delà de l&#x27;aspect juridique, le référendum apporte quelque chose d&#x27;essentiel : une légitimité populaire directe. C&#x27;est le peuple lui-même qui valide le nouveau modèle institutionnel.<\/p>\n<p>Ensuite, le 4 octobre 1958, la Constitution est promulguée. C&#x27;est la date de naissance officielle de la Ve République. Note bien la différence : 28 septembre, le référendum. 4 octobre, la promulgation.<\/p>\n<p>Puis, le 21 décembre 1958, de Gaulle est élu président de la République. Mais attention : il est élu au suffrage universel indirect, par un collège d&#x27;environ 80 000 grands électeurs. Ce sont des parlementaires, des élus locaux, et d&#x27;autres représentants.<\/p>\n<p>Il prend ses fonctions le 8 janvier 1959.<\/p>\n<p>Et voici un point qui tombe très souvent : l&#x27;élection du président au suffrage universel direct n&#x27;existe pas en 1958. Elle arrive seulement avec la révision constitutionnelle de 1962.<\/p>\n<p class=\"recap\">Récap : 28 septembre, référendum. 4 octobre, promulgation. 21 décembre, élection de De Gaulle au suffrage indirect. 8 janvier 1959, prise de fonctions. Et le suffrage direct, seulement en 1962.<\/p>\n<p>Fais une petite pause si tu veux. On attaque maintenant le cœur du fonctionnement des institutions.<\/p>\n<h3>6. L&#x27;idée centrale : le parlementarisme rationalisé<\/h3>\n<p>L&#x27;idée centrale de la Constitution de 1958, c&#x27;est le parlementarisme rationalisé.<\/p>\n<p>Rationaliser, ça veut dire encadrer par des règles précises la façon dont le Parlement agit, pour que le gouvernement reste stable. On garde la responsabilité du gouvernement devant les députés, conformément à la loi du 3 juin. Mais cette responsabilité devient beaucoup plus difficile à mettre en jeu. C&#x27;est la réponse directe à l&#x27;instabilité ministérielle de la IVe République.<\/p>\n<p>Voyons les outils principaux.<\/p>\n<p>Premier outil : la motion de censure, prévue à l&#x27;article 49. Pour être déposée, elle doit être signée par au moins un dixième des députés. Et surtout, seuls les votes favorables à la censure sont comptés. Pour qu&#x27;elle soit adoptée, il faut la majorité absolue des membres de l&#x27;Assemblée nationale. Conséquence très concrète : une abstention compte, en pratique, comme un soutien au gouvernement. Ceux qui ne votent pas la censure aident le gouvernement à rester en place.<\/p>\n<p>Deuxième outil : le fameux article 49 alinéa 3, qu&#x27;on appelle le 49.3. Le gouvernement engage sa responsabilité sur un texte. Et le texte est considéré comme adopté, sauf si une motion de censure est votée. Autrement dit, pour bloquer le texte, les députés doivent renverser le gouvernement.<\/p>\n<p>IIIe outil : le vote bloqué, à l&#x27;article 44 alinéa 3. Le gouvernement oblige l&#x27;assemblée à se prononcer en un seul vote, sur tout ou partie du texte, en ne retenant que les amendements qu&#x27;il accepte. Ça évite que les débats s&#x27;enlisent sous des centaines d&#x27;amendements.<\/p>\n<p>Quatrième outil : l&#x27;ordre du jour. En 1958, il est largement fixé par le gouvernement. C&#x27;est donc le gouvernement qui décide de quoi le Parlement va débattre. Note que la révision de 2008 a rendu une partie de cette maîtrise au Parlement.<\/p>\n<p>Et enfin, cinquième élément : le nombre de commissions permanentes est limité, et les sessions parlementaires sont encadrées dans le temps.<\/p>\n<p class=\"recap\">Récap : motion de censure difficile à faire passer, 49.3, vote bloqué, ordre du jour maîtrisé par le gouvernement, commissions limitées. Tout ça vise un seul objectif : la stabilité du gouvernement.<\/p>\n<h3>7. Le partage entre la loi et le règlement<\/h3>\n<p>Deuxième grande nouveauté de 1958 : le partage entre la loi et le règlement.<\/p>\n<p>Avant 1958, la loi pouvait tout régler. Le Parlement était libre d&#x27;intervenir dans n&#x27;importe quel domaine.<\/p>\n<p>Avec la nouvelle Constitution, ça change. L&#x27;article 34 donne une liste limitée des matières dans lesquelles le Parlement vote la loi. Et l&#x27;article 37 dit que tout le reste relève du règlement, c&#x27;est-à-dire des décrets pris par le gouvernement.<\/p>\n<p>Il y a aussi un mécanisme important : les ordonnances, prévues à l&#x27;article 38. Le Parlement peut autoriser le gouvernement à prendre lui-même, pendant un temps limité, des mesures qui relèvent normalement de la loi. Ensuite, le Parlement doit ratifier ces ordonnances.<\/p>\n<p class=\"recap\">Récap : article 34, le domaine de la loi, limité. Article 37, tout le reste, le règlement. Article 38, les ordonnances. Depuis 1958, le domaine de la loi est délimité.<\/p>\n<h3>8. Un Président renforcé<\/h3>\n<p>Passons maintenant au Président de la République.<\/p>\n<p>Michel Debré a eu une formule restée célèbre : le Président est la clé de voûte des institutions. Selon l&#x27;article 5, il est l&#x27;arbitre. Il veille au respect de la Constitution et assure le fonctionnement régulier des pouvoirs publics.<\/p>\n<p>Pour comprendre ses pouvoirs, il faut connaître une notion clé : le contreseing. La plupart des actes du Président doivent être contresignés, c&#x27;est-à-dire cosignés par le Premier ministre ou par les ministres concernés. Ce sont eux qui en assument ainsi la responsabilité politique.<\/p>\n<p>Mais certains pouvoirs sont dispensés de contreseing. On les appelle les pouvoirs propres, et ils sont listés à l&#x27;article 19. Je te donne les principaux.<\/p>\n<p>Un : la nomination du Premier ministre.<\/p>\n<p>Deux : le recours au référendum, prévu à l&#x27;article 11.<\/p>\n<p>Trois : la dissolution de l&#x27;Assemblée nationale, à l&#x27;article 12.<\/p>\n<p>Quatre : les pleins pouvoirs en cas de crise grave, à l&#x27;article 16.<\/p>\n<p>Cinq : la nomination de 3 des 9 membres du Conseil constitutionnel. Les six autres sont nommés par le président de l&#x27;Assemblée nationale et par le président du Sénat.<\/p>\n<p>Six : la saisine du Conseil constitutionnel.<\/p>\n<p>Et sept : les messages adressés au Parlement.<\/p>\n<p>Attention maintenant à une confusion très fréquente. Ce n&#x27;est pas le Président qui détermine et conduit la politique de la Nation. Selon l&#x27;article 20, c&#x27;est le Gouvernement qui détermine et conduit la politique de la Nation. Le Président arbitre, le Gouvernement gouverne, et il est responsable devant le Parlement.<\/p>\n<p class=\"recap\">Récap : Président clé de voûte et arbitre, article 5. Pouvoirs propres sans contreseing, article 19. Et le Gouvernement qui détermine et conduit la politique de la Nation, article 20.<\/p>\n<h3>9. Le Conseil constitutionnel, la grande innovation<\/h3>\n<p>On arrive à la grande innovation de 1958 : le Conseil constitutionnel.<\/p>\n<p>Pourquoi c&#x27;est une innovation ? Parce que c&#x27;est la première fois en France qu&#x27;un juge spécialisé est chargé de contrôler la constitutionnalité des lois. Le bicamérisme, la souveraineté nationale, la responsabilité du gouvernement, tout ça existait déjà avant. Mais un vrai juge de la constitutionnalité des lois, c&#x27;est nouveau.<\/p>\n<p>En 1958, ce contrôle se fait a priori. Ça veut dire avant la promulgation de la loi. Et le Conseil ne peut être saisi que par des autorités politiques : le Président de la République, le Premier ministre, le président de l&#x27;Assemblée nationale et le président du Sénat. Les lois organiques, elles, lui sont transmises automatiquement, d&#x27;office.<\/p>\n<p>À l&#x27;origine, sa mission principale était de faire respecter la frontière entre la loi et le règlement, c&#x27;est-à-dire entre les articles 34 et 37. L&#x27;idée était d&#x27;empêcher le Parlement de déborder de son domaine.<\/p>\n<p>Ensuite, le Conseil a beaucoup évolué. En 1974, la saisine est ouverte à 60 députés ou 60 sénateurs. Ça permet à l&#x27;opposition de saisir le Conseil. Et en 2008, la révision constitutionnelle crée la QPC, la question prioritaire de constitutionnalité, entrée en application en 2010. Elle permet un contrôle a posteriori, c&#x27;est-à-dire sur une loi déjà en vigueur, et elle est ouverte aux justiciables, à l&#x27;occasion d&#x27;un procès.<\/p>\n<p class=\"recap\">Récap : Conseil constitutionnel, la grande innovation. En 1958, contrôle a priori, sur saisine politique, lois organiques transmises d&#x27;office. 1974, 60 députés ou 60 sénateurs. 2008, la QPC et le contrôle a posteriori.<\/p>\n<h3>10. Le bilan de 1958<\/h3>\n<p>Alors, quel bilan tirer de tout ça ?<\/p>\n<p>La Constitution de 1958, ce n&#x27;est pas un régime présidentiel à l&#x27;américaine. Ce n&#x27;est pas non plus un retour à la IIIe ou à la IVe République. C&#x27;est un régime parlementaire, avec un exécutif renforcé et un Parlement encadré.<\/p>\n<p>On parle souvent de régime semi-présidentiel, surtout depuis la révision de 1962 et l&#x27;élection du Président au suffrage universel direct.<\/p>\n<p class=\"recap\">Si tu dois retenir une phrase : en 1958, on garde le parlementarisme, mais on le rationalise, et on renforce l&#x27;exécutif.<\/p>\n<h3>11. Les pièges classiques<\/h3>\n<p>Avant de finir, voici les pièges classiques. Ce sont les confusions qui font perdre des points.<\/p>\n<p class=\"piege\">Piège numéro un : ne confonds pas le Comité consultatif constitutionnel et le Conseil constitutionnel. Le Comité consultatif constitutionnel est un organe consultatif, créé spécialement pour la rédaction de 1958. Le Conseil constitutionnel, lui, est un juge, créé par la Constitution de 1958.<\/p>\n<p class=\"piege\">Piège numéro deux : ne confonds pas le référendum et la promulgation. Le référendum, c&#x27;est le 28 septembre. La promulgation, c&#x27;est le 4 octobre.<\/p>\n<p class=\"piege\">Piège numéro trois : ne confonds pas le suffrage indirect et le suffrage direct. En 1958, de Gaulle est élu au suffrage universel indirect. Le suffrage universel direct n&#x27;arrive qu&#x27;en 1962.<\/p>\n<p class=\"piege\">Piège numéro quatre : le texte qui autorise la rédaction de la Constitution, c&#x27;est la loi constitutionnelle du 3 juin 1958. Les ordonnances, elles, sont un outil prévu par l&#x27;article 38. Ce n&#x27;est pas le texte fondateur.<\/p>\n<p>Et piège numéro cinq : avant 2008, le contrôle de constitutionnalité est a priori et déclenché par des autorités politiques. Avec la QPC, il devient aussi a posteriori, et ouvert aux justiciables.<\/p>\n<h3>12. Récap final des dates clés<\/h3>\n<p>Pour terminer, on fait le récap des dates clés. Écoute bien, et essaie de les répéter dans ta tête.<\/p>\n<p>16 juin 1946 : le discours de Bayeux.<\/p>\n<p>13 mai 1958 : les émeutes d&#x27;Alger et le Comité de salut public.<\/p>\n<p>1er juin 1958 : de Gaulle est investi président du Conseil.<\/p>\n<p>3 juin 1958 : la loi constitutionnelle et ses cinq principes.<\/p>\n<p>28 septembre 1958 : le référendum, avec environ 80 % de oui.<\/p>\n<p>4 octobre 1958 : la promulgation, naissance officielle de la Ve République.<\/p>\n<p>21 décembre 1958 : élection de De Gaulle au suffrage universel indirect.<\/p>\n<p>8 janvier 1959 : sa prise de fonctions.<\/p>\n<p>1962 : l&#x27;élection du Président au suffrage universel direct.<\/p>\n<p>1974 : la saisine du Conseil constitutionnel ouverte à 60 députés ou 60 sénateurs.<\/p>\n<p>Et 2008 : la grande révision, avec la création de la QPC.<\/p>\n<p>Voilà, c&#x27;est la fin de ce podcast. Tu as maintenant toute la logique de la naissance de la Ve République : pourquoi on change de régime, comment le texte est construit, et ce qu&#x27;il change. N&#x27;hésite pas à le réécouter plusieurs fois, par exemple dans les transports ou avant une séance de révision. Bon courage pour ta prépa, et à très vite.<\/p>","words":2573},"fiches":{"dc":[{"t":"La naissance de 1958","p":["13 mai 1958 : émeute d’Alger et Comité de salut public ; 1er juin : De Gaulle investi président du Conseil.","Loi constitutionnelle du 3 juin 1958 : 5 principes : (1) le suffrage universel, seule source du pouvoir ; (2) la séparation des pouvoirs exécutif et législatif ; (3) la responsabilité du Gouvernement devant le Parlement ; (4) l’indépendance de l’autorité judiciaire ; (5) l’organisation des rapports avec les peuples associés.","Rédaction : Michel Debré (garde des Sceaux). Avis : Comité consultatif constitutionnel (CCC), puis Conseil d’État en assemblée générale.","28 septembre 1958 : référendum (environ 80 % de oui). 4 octobre 1958 : promulgation, naissance de la Ve République.","21 décembre 1958 : De Gaulle élu au suffrage universel indirect (environ 80 000 grands électeurs) ; prise de fonctions le 8 janvier 1959. Le suffrage universel direct date de 1962."]},{"t":"Le Président de la République","p":["Art. 5 : arbitre, il veille au respect de la Constitution (« clé de voûte », selon Michel Debré).","Art. 19 : pouvoirs propres, dispensés de contreseing : nomination du Premier ministre, référendum (art. 11), dissolution (art. 12), pleins pouvoirs (art. 16), nomination de 3 des 9 membres du Conseil constitutionnel, saisine du Conseil, messages au Parlement.","Art. 7 : en cas de vacance, l’intérim est assuré par le président du Sénat.","Art. 12 : six dissolutions (1962, 1968, 1981, 1988, 1997, 9 juin 2024).","Art. 16 : appliqué une seule fois, en 1961 ; depuis 2008, le Conseil constitutionnel peut être saisi au bout de 30 jours.","Art. 18 al. 2 (2008) : le Président peut s’exprimer devant le Congrès ; débat hors sa présence, sans vote.","Art. 68 : destitution par la Haute Cour pour manquement à ses devoirs (révision du 23 février 2007)."]},{"t":"Gouvernement et Parlement","p":["Art. 20 : le Gouvernement détermine et conduit la politique de la Nation ; il est responsable devant le Parlement.","Art. 49 : motion de censure signée par 1/10 des députés, adoptée à la majorité absolue des membres ; seuls les votes favorables sont comptés.","Art. 49 al. 3 : texte considéré comme adopté sauf vote d’une motion de censure. Art. 44 al. 3 : vote bloqué.","Art. 34 : domaine de la loi limité ; art. 37 : le reste relève du règlement ; art. 38 : ordonnances, sur habilitation du Parlement.","Art. 24 : 577 députés et 348 sénateurs au plus. Session ordinaire unique de 9 mois depuis 1995.","Art. 68-1 : la Cour de justice de la République juge les membres du Gouvernement (révision de 1993)."]},{"t":"Conseil constitutionnel","p":["Art. 56 : 9 membres nommés pour 9 ans, renouvelés par tiers tous les 3 ans ; 3 nommés par le Président de la République, 3 par le président du Sénat, 3 par le président de l’Assemblée nationale.","Art. 61 : contrôle a priori, obligatoire pour les lois organiques, les règlements des assemblées et les propositions de loi référendaires.","1974 : saisine ouverte à 60 députés ou 60 sénateurs.","Art. 61-1 : QPC (révision de 2008, en vigueur le 1er mars 2010), filtrée par le Conseil d’État ou la Cour de cassation ; décision sous 3 mois ; impossible devant la cour d’assises.","Bloc de constitutionnalité : Constitution, DDHC de 1789, préambule de 1946, Charte de l’environnement de 2004, PFRLR (décision du 16 juillet 1971). Les traités n’en font pas partie (décision IVG, 15 janvier 1975).","Art. 58 : il veille à la régularité de l’élection présidentielle et en proclame les résultats."]},{"t":"Révisions et référendums","p":["Art. 89 : la révision relève du pouvoir constituant dérivé.","Plus de 20 révisions : 1962 (suffrage universel direct), 1974 (saisine parlementaire), 1992 (Maastricht), 1993 (CJR), 1995 (session unique), 2000 (quinquennat), 28 mars 2003 (organisation décentralisée), 2008 (grande révision), 8 mars 2024 (liberté garantie de recourir à l’IVG).","Art. 11 al. 3 : référendum d’initiative partagée, à l’initiative d’1/5 des parlementaires soutenue par 1/10 des électeurs inscrits (applicable depuis 2015)."]}],"da":[{"t":"Grands arrêts","p":["TC 8 février 1873, Blanco : responsabilité administrative autonome et compétence du juge administratif.","TC 22 janvier 1921, Société commerciale de l’Ouest africain (« Bac d’Eloka ») : services publics industriels et commerciaux.","CE 1923 Couitéas et CE 1938 La Fleurette : responsabilité sans faute pour rupture d’égalité devant les charges publiques.","CE Sect. 7 février 1936, Jamart : pouvoir réglementaire du chef de service.","CE Ass. 1951, Laruelle et Delville : action récursoire et partage de responsabilité avec l’agent.","CE Ass. 27 octobre 1995, Commune de Morsang-sur-Orge : la dignité de la personne humaine relève de l’ordre public.","CE Sect. 2002, Duvignères : les dispositions impératives d’une circulaire sont attaquables.","TC 17 juin 2013, Bergoend : définition resserrée de la voie de fait."]},{"t":"Juge et procédure","p":["La procédure est écrite, contradictoire et inquisitoire ; les jugements sont rendus « au nom du peuple français » (art. L. 2 CJA).","Délai de recours : deux mois à compter de la notification ou de la publication (art. R. 421-1 CJA).","Référés : suspension (L. 521-1), liberté fondamentale avec décision sous 48 h (L. 521-2), mesures utiles (L. 521-3), provision (R. 541-1).","Neuf cours administratives d’appel ; la 9e, à Toulouse, a été installée le 1er mars 2022.","Le Conseil d’État est présidé par son vice-président (art. L. 121-1 CJA).","Loi du 31 décembre 1957 : les dommages causés par un véhicule relèvent du juge judiciaire."]},{"t":"Actes et police","p":["Le silence vaut acceptation (loi du 12 novembre 2013, art. L. 231-1 CRPA), sauf nombreuses exceptions.","La motivation est obligatoire pour retirer ou abroger une décision créatrice de droits (art. L. 211-2 CRPA).","Ordonnance de l’art. 38 : acte réglementaire avant ratification, législatif après.","Une mesure de police doit être adaptée, nécessaire et proportionnée.","Contrôle de légalité a posteriori depuis la loi du 2 mars 1982 : le préfet défère l’acte au tribunal administratif."]}],"ue":[{"t":"Histoire","p":["Traité CECA signé à Paris le 18 avril 1951, en vigueur le 23 juillet 1952, expiré en 2002.","Critères de Copenhague (1993) : politique, économique et reprise de l’acquis.","Traité de Lisbonne signé le 13 décembre 2007, en vigueur le 1er décembre 2009 ; la Charte des droits fondamentaux a la même valeur juridique que les traités (art. 6 TUE).","Le Groenland, entré avec le Danemark en 1973, en est sorti en 1985.","Boussole stratégique (mars 2022) : orientations de sécurité et de défense à l’horizon 2030."]},{"t":"Institutions","p":["Commission : un commissaire par État (27), quasi-monopole de l’initiative (art. 17 TUE) ; elle négocie les accords commerciaux sur mandat du Conseil.","Conseil européen : chefs d’État ou de gouvernement ; président élu à la majorité qualifiée pour 2 ans et demi, renouvelable une fois ; António Costa depuis le 1er décembre 2024.","Conseil de l’UE : majorité qualifiée de 55 % des États représentant 65 % de la population (art. 16 TUE), ou 72 % des États si la proposition ne vient pas de la Commission.","Parlement européen : 720 députés, dont 81 pour la France (élections des 6-9 juin 2024) ; plafond de 751 ; Roberta Metsola réélue présidente en juillet 2024.","Haut représentant (traité de Lisbonne), aussi vice-président de la Commission.","Le Comité des régions est un organe consultatif, pas une institution.","Trilogue : négociations informelles entre le Parlement, le Conseil et la Commission.","Le Conseil de l’Europe (1949, Strasbourg, 46 États) est distinct de l’UE : il a élaboré la CEDH."]},{"t":"Compétences et règles","p":["Compétences exclusives (art. 3 TFUE) : union douanière, concurrence, politique monétaire de la zone euro, conservation des ressources biologiques de la mer, politique commerciale commune.","Compétences partagées (art. 4 TFUE) : notamment l’agriculture et la pêche (hors conservation des ressources de la mer).","PESC : unanimité, sauf exceptions (art. 24 et 31 TUE).","Adhésion (art. 49 TUE) : unanimité du Conseil, après avis de la Commission et approbation du Parlement.","Régions ultrapériphériques (art. 349 TFUE) : 9, dont 6 françaises.","Ressource propre « plastique » : contribution sur les déchets d’emballages plastiques non recyclés."]}],"rh":[{"t":"Statut et carrière","p":["Code général de la fonction publique (CGFP) : trois versants (État, territoriale, hospitalière).","Positions : activité, détachement, disponibilité, congé parental ; la mise à disposition est une modalité de l’activité.","Entretien professionnel annuel et obligatoire, conduit par le supérieur hiérarchique direct.","RIFSEEP : IFSE (part fixe) et CIA (part variable) ; la NBI est liée à l’emploi occupé.","Les attachés d’administration de l’État forment un corps interministériel à gestion ministérielle (CIGeM) depuis 2013.","Les ressortissants européens ont accès à la fonction publique, sauf aux emplois de souveraineté."]},{"t":"Droits, obligations, déontologie","p":["Loi du 20 avril 2016 sur la déontologie : dignité, impartialité, intégrité et probité (art. L. 121-1 CGFP).","Obligation de réserve : d’origine jurisprudentielle.","Protection fonctionnelle : l’administration protège l’agent et peut prendre en charge ses frais de procédure.","Une activité accessoire d’enseignement peut être autorisée (décret du 30 janvier 2020).","Fonction publique de l’État : retenue d’un trentième indivisible pour toute fraction de journée de grève."]},{"t":"Discipline et dialogue social","p":["Sanctions du 1er groupe : avertissement, blâme, exclusion temporaire de 1 à 3 jours (art. L. 533-1 CGFP).","Prescription de l’action disciplinaire : 3 ans.","Abandon de poste : radiation des cadres après mise en demeure, sans procédure disciplinaire.","Loi du 6 août 2019 : CAP recentrées sur les décisions individuelles défavorables ; comités sociaux (fusion des CT et CHSCT) installés après les élections du 8 décembre 2022 ; contrat de projet (1 à 6 ans) ; prime de précarité (depuis le 1er janvier 2021).","Obligation d’emploi des travailleurs handicapés : 6 % de l’effectif, sinon contribution au FIPHFP."]}],"cg":[{"t":"Organisation territoriale","p":["13 régions métropolitaines (loi du 16 janvier 2015), 18 avec l’outre-mer.","Conseillers départementaux : scrutin binominal majoritaire à deux tours (loi du 17 mai 2013, depuis 2015).","La métropole est un EPCI à fiscalité propre ; la métropole de Lyon (1er janvier 2015) est une collectivité à statut particulier.","Le département est chef de file de l’action sociale ; la clause générale de compétence a été supprimée pour les départements et les régions, les communes la conservent.","Loi 3DS : différenciation, décentralisation, déconcentration, simplification.","Référendum local décisionnel (art. 72-1 C) : la moitié des inscrits doit avoir voté et la majorité des suffrages exprimés doit être favorable.","Déconcentration : des pouvoirs de décision sont confiés aux autorités locales de l’État ; décentralisation : des compétences sont transférées à des personnes morales distinctes.","Le préfet de région est garant de l’action de l’État dans la région (décret du 29 avril 2004)."]},{"t":"Service public et politiques publiques","p":["Lois du service public : continuité (valeur constitutionnelle, 1979), égalité, mutabilité.","ANCT : « fabrique à projets » pour les territoires ; elle pilote France Services, Action cœur de ville et Petites villes de demain.","France Services : guichets de proximité labellisés, réseau lancé en 2019.","Droit à l’erreur de l’usager de bonne foi (art. L. 123-1 CRPA) ; « dites-le-nous une fois ».","Instruction obligatoire de 3 à 16 ans (rentrée 2019) ; obligation de formation jusqu’à 18 ans (loi du 26 juillet 2019).","Parcoursup : loi ORE du 8 mars 2018.","La Cour des comptes assiste le Parlement et le Gouvernement dans l’évaluation des politiques publiques (révision de 2008)."]}],"eco":[{"t":"Agrégats et notions","p":["PIB : somme des valeurs ajoutées des unités résidentes, plus les impôts nets des subventions sur les produits.","Chômeur au sens du BIT : sans emploi, disponible dans les deux semaines et en recherche active.","Récession : recul du PIB pendant deux trimestres consécutifs.","Solde structurel : solde public corrigé des effets de la conjoncture.","Stabilisateurs automatiques : recettes et dépenses qui amortissent spontanément la conjoncture.","Dette au sens de Maastricht : dette brute consolidée des administrations publiques, en valeur nominale.","Prélèvements obligatoires : impôts et cotisations sociales effectives versés aux administrations publiques et à l’UE."]},{"t":"Politiques et auteurs","p":["Keynes, Théorie générale (1936) : intervention de l’État pour soutenir la demande.","Courbe de Phillips (1958) : relation décroissante entre chômage et hausse des salaires.","Effet d’éviction : la dépense publique financée par l’emprunt réduit l’investissement privé.","Pigou (1920) : la taxe corrige une externalité négative.","BCE : cible d’inflation de 2 % à moyen terme, symétrique (revue de 2021) ; le Conseil des gouverneurs décide.","Assouplissement quantitatif : rachats massifs de titres (APP, PEPP).","NextGenerationEU : emprunt commun d’environ 750 Md€ (prix 2018) ; France 2030 : 54 Md€.","SMIC revalorisé au 1er janvier ; Autorité de la concurrence créée par la loi du 4 août 2008 ; aides d’État encadrées par l’art. 107 TFUE."]}],"fp":[{"t":"LOLF et principes","p":["LOLF de 2001 : missions (unité de vote, ministérielles ou interministérielles), programmes, actions ; crédits votés en AE et en CP (art. 8).","Fongibilité asymétrique : les crédits du titre 2 (personnel) peuvent financer d’autres dépenses du programme, jamais l’inverse.","Principes classiques (annualité, unité, universalité, spécialité) et sincérité (LOLF) ; le fonds de concours est une exception à la non-affectation.","Le décret d’avance est pris après avis du Conseil d’État et des commissions des finances (art. 13 LOLF).","La loi de finances a 2 parties : recettes et équilibre, puis dépenses ; la 1re partie doit être votée avant la seconde. Délais : 70 jours (art. 47 C) ; 50 jours pour la LFSS (art. 47-1).","Art. 40 C : irrecevabilité des amendements qui diminuent les ressources ou créent une charge.","La loi de fin de gestion et la loi relative aux résultats de la gestion (ex-loi de règlement)."]},{"t":"Acteurs et exécution","p":["Ordonnateurs principaux (ministres), secondaires (préfets) ; le comptable contrôle la régularité, pas l’opportunité.","Dépense : engagement, liquidation, ordonnancement (ordonnateur), puis paiement (comptable).","Gestion de fait : maniement de deniers publics sans habilitation.","Depuis le 1er janvier 2023, une chambre du contentieux de la Cour des comptes juge les gestionnaires publics (fin de la CDBF).","La Cour des comptes certifie les comptes de l’État (art. 58 LOLF) ; son premier président préside le HCFP.","L’Agence France Trésor (2001) gère la dette ; la TVA est la 1re recette fiscale (taux 20 %, 10 %, 5,5 %, 2,1 %)."]},{"t":"Cadre européen et local","p":["Pacte de stabilité : 3 % de déficit, 60 % de dette ; cadre réformé en 2024.","TSCG : « règle d’or » d’un déficit structurel de 0,5 % du PIB (1 % si la dette est inférieure à 60 %).","Art. 72-2 C (2003) : autonomie financière et péréquation."]}],"act":[{"t":"Budget et finances 2025-2026","p":["Échec de la CMP le 19 décembre 2025, puis loi spéciale (projet déposé le 22 décembre 2025).","49.3 utilisé les 20, 23 et 30 janvier 2026 ; adoption définitive le 2 février 2026 ; LFI 2026 promulguée le 19 février 2026.","Déficit 2025 : 5,1 % du PIB ; dette fin 2025 : 115,6 % du PIB (Insee, 26 mars 2026).","PLF 2027 déposé le 1er octobre 2026 ; le Parlement a 70 jours."]},{"t":"Institutions et élections","p":["Gouvernement Lecornu : nommé le 9 septembre 2025, démission le 6 octobre, reconduit le 10 octobre 2025.","Municipales les 15 et 22 mars 2026 : scrutin de liste paritaire sans panachage dans toutes les communes (loi du 21 mai 2025) ; réforme « PLM ».","Richard Ferrand préside le Conseil constitutionnel depuis le 8 mars 2025.","Réforme des retraites de 2023 suspendue jusqu’en janvier 2028.","Les IRA deviennent les Instituts du service public (ISP), regroupés dans le G-ISP ; épreuve mixte de 60 QCM et 2 QRC sur 3 (arrêté du 24 avril 2026)."]},{"t":"Europe","p":["La Bulgarie adopte l’euro (1 € = 1,95583 lev).","Présidences du Conseil : Chypre (1er semestre 2026), Irlande (2e semestre 2026), Lituanie (1er semestre 2027).","Pacte sur la migration et l’asile applicable le 12 juin 2026 ; système d’entrée/sortie (EES) en service depuis le 12 octobre 2025."]}]},"maps":{"dc":["Constitution de 1958",[["Naissance",[["13 mai 1958 : Alger",[]],["1er juin : investiture",[]],["Loi du 3 juin : 5 principes",[["Suffrage universel",[]],["Séparation des pouvoirs",[]],["Responsabilité du Gouvernement",[]],["Indépendance judiciaire",[]],["Peuples associés",[]]]],["28 sept. : référendum (80 %)",[]],["4 oct. : promulgation",[]]]],["Président",[["Art. 5 : arbitre",[]],["Art. 19 : pouvoirs propres",[["Référendum (art. 11)",[]],["Dissolution (art. 12)",[]],["Art. 16",[]],["Nomination du PM",[]]]],["Art. 7 : intérim par le président du Sénat",[]],["Élu au SUD depuis 1962",[]]]],["Gouvernement et Parlement",[["Art. 20 : conduit la politique",[]],["Art. 49 : censure, 49.3",[]],["Art. 44.3 : vote bloqué",[]],["Art. 34/37 : loi et règlement",[]],["Art. 38 : ordonnances",[]],["577 députés, 348 sénateurs",[]]]],["Conseil constitutionnel",[["9 membres, 9 ans",[]],["Contrôle a priori (art. 61)",[]],["1974 : 60 députés / 60 sénateurs",[]],["QPC (art. 61-1, 2010)",[]],["Bloc : 1789, 1946, 2004",[]]]]]],"da":["Droit administratif",[["Grands arrêts",[["Blanco 1873",[]],["Bac d’Eloka 1921",[]],["Couitéas 1923",[]],["Jamart 1936",[]],["Morsang-sur-Orge 1995",[]],["Bergoend 2013",[]]]],["Juge",[["Procédure écrite, inquisitoire",[]],["Recours : 2 mois",[]],["Référés",[["Suspension L. 521-1",[]],["Liberté L. 521-2 (48 h)",[]],["Mesures utiles L. 521-3",[]]]],["9 CAA (Toulouse 2022)",[]]]],["Actes",[["Silence vaut acceptation (2013)",[]],["Motivation (L. 211-2 CRPA)",[]],["Circulaire impérative (Duvignères)",[]],["Ordonnance ratif  href=\"https://reussira.les-ira.fr/main/auth/inscription.php\" target=\"_blank\" rel=\"noopener\">https://reussira.les-ira.fr/main/auth/inscription.php<\/a>.","<b>3. Lire 2 ou 3 rapports de jury récents<\/b> (2026 et 2025, puis 2024) : ce que le jury attend du cas pratique et de l’oral, les erreurs fréquentes.","<b>4. Cas pratique : traiter les sujets 2026, 2025 et 2024 en 4 h chrono<\/b>, puis comparer chaque copie aux <b>meilleures copies externes<\/b> de la même session. Poursuivre avec 2023-2, 2023-1, 2022-2, etc.","<b>5. QCM : utiliser les corrigés officiels 2024, 2023-2, 2022-2, 2022-1, 2021-2, 2021-1 et 2020-2<\/b> par blocs de 60 questions en 1 h 10 environ, <b>en sautant la culture numérique<\/b> (hors programme 2027). Compléter avec le recueil « QCM_semestre1_IRA.pdf ».","<b>6. QRC : s’entraîner sur les 4 thèmes officiels<\/b>, avec 2 questions en 50 min environ. Supports : le sujet blanc du manuel Studyrama 2027-2028 (payant) et les sujets de QRC IRA 2016-2018 (SupConcours), anciens mais utiles pour le calibrage (20 lignes par réponse).","<b>7. Oral : dès les résultats d’admissibilité, rédiger la FIR<\/b> (voir le cas de 2026 : environ 10 jours pour la saisir), relire les rapports de jury (partie entretien) et faire des oraux blancs."],"cp":[{"r":"Annales officielles – sujets de cas pratique<br/><a href=\"https://www.fonction-publique.gouv.fr/devenir-agent-public/les-annales-des-concours\" target=\"_blank\" rel=\"noopener\">https://www.fonction-publique.gouv.fr/devenir-agent-public/les-annales-des-concours<\/a>","y":"2021-1 à 2026 (sessions de printemps et d’automne 2021-2023, puis une session par an)","c":"9 sujets (dossier de 30 à 34 pages chacun) : <b>2026<\/b> ANCT / France Services ; <b>2025<\/b> pouvoir de dérogation du préfet (circulaire du 28 oct. 2024) ; <b>2024<\/b> harcèlement scolaire (cabinet du recteur) ; <b>2023-2<\/b> plan de sobriété énergétique (préfecture) ; <b>2023-1<\/b> délais CNI et passeports ; <b>2022-2<\/b> télétravail (accord du 13 juillet 2021, SGAR) ; <b>2022-1<\/b> zones à faibles émissions ; <b>2021-2<\/b> insertion, AMI (préfecture de région) ; <b>2021-1<\/b> service d’archives (ERP, patrimoine). Sujets seuls, sans corrigé.","acc":"Gratuit","g":"G","p":"<b>Très forte<\/b> : épreuve identique en 2027. Les sujets 2024-2026 sont prioritaires."},{"r":"SupConcours – sujet de cas pratique IRA printemps 2020 (absent du site officiel)<br/><a href=\"https://supconcours.com/wp-content/uploads/2021/01/IRA-EXT-Annales-2020-printemps-CP.pdf\" target=\"_blank\" rel=\"noopener\">https://supconcours.com/wp-content/uploads/2021/01/IRA-EXT-Annales-2020-printemps-CP.pdf<\/a>","y":"2020-1","c":"Sujet de 33 pages : référent ORT (opération de revitalisation de territoire) en préfecture, préparation d’une réunion stratégique. Sujet seul. Les sujets 2020-2024 sont aussi repris sur cet index.","acc":"Gratuit","g":"G","p":"<b>Forte<\/b> : même format que 2027, 6 ans."},{"r":"Meilleures copies et corrigés<br/><a href=\"https://www.fonction-publique.gouv.fr/devenir-agent-public/les-meilleures-copies-et-corriges\" target=\"_blank\" rel=\"noopener\">https://www.fonction-publique.gouv.fr/devenir-agent-public/les-meilleures-copies-et-corriges<\/a>","y":"2020 à 2026","c":"Meilleures copies du cas pratique par IRA (Bastia, Lille, Lyon, Metz, Nantes) et par concours (externe, interne, 3e concours). Pour 2024, 2025 et 2026 : 1 copie externe par IRA, soit 5 copies par session (copies scannées, par exemple 12 pages pour Lille 2026). Ce sont des copies réelles, pas des corrigés types.","acc":"Gratuit","g":"G","p":"<b>Très forte<\/b> : c’est la référence pour calibrer la note et les documents opérationnels. Prendre les copies <b>externes<\/b>."},{"r":"Rapports de jury<br/><a href=\"https://www.fonction-publique.gouv.fr/devenir-agent-public/les-rapports-de-jury\" target=\"_blank\" rel=\"noopener\">https://www.fonction-publique.gouv.fr/devenir-agent-public/les-rapports-de-jury<\/a>","y":"2020-1 à 2026 (5 IRA)","c":"Un rappor function answer(j){const R=RUN;if(R.ans!==null)return;const q=QBY[R.ids[R.i]],ri=R.perm[j],ok=ri===q.a;R.ans=j;
  record(q,ok,R.mode);if(ok)R.ok++;R.res.push({id:q.id,ok,ch:ri});gain(ok?(R.mode==='err'?12:10):2,ok?'Bonne réponse':'Effort',true);

function finishRun(){const R=RUN;if(!R)return;RUN=null;clearTimers();const n=R.res.length,ok=R.ok,pct=n?Math.round(100*ok/n):0,dd=day();let bonus=0,msg='',rec='';

function neonize(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sa=0,l=(mx+mn)/2;

function mapV(root,open,col,vw,z){const PAL=['#00e5ff','#ff2bd6','#b6ff3b','#ffd23f','#7c4dff','#ff9100'],W=Math.max(300,vw-2),IND=22,nodes=[],links=[];let y=10;const fs=12.5*z;

function wrap(t,max){const w=t.split(' '),L=[];let c='';for(const x of w){if((c+' '+x).trim().length>max&&c){L.push(c);c=x}else c=(c+' '+x).trim()}if(c)L.push(c);return L}
function mapSVG(root,open,col,z){const XS=[0,190,420,650],WS=[170,210,210,200],GAP=8,nodes=[],links=[];let y=10;

  for(const n of nodes){const c=n.d===0?col:n.bc;s+=`<g class="mn d${n.d}" data-id="${n.id}" ${n.leaf?'data-leaf="1"':''}><rect x="${n.x}" y="${n.y-n.h/2}" width="${n.w}" height="${n.h}" rx="10" fill="${n.d===0?'rgba(0,0,0,.6)':'rgba(16,18,36,.95)'}" stroke="${c}" stroke-width="${n.d===0?2.5:1.4}" style="filter:drop-shadow(0 0 ${n.d===0?10:4}px ${c})"/>
    ${n.lines.map((l,i)=>`<text x="${n.x+10}" y="${n.y-n.h/2+19+i*15}">${esc(l)}</text>`).join('')}${n.leaf?'':`<circle cx="${n.x+n.w}" cy="${n.y}" r="8" fill="${c}"/><text x="${n.x+n.w}" y="${n.y+4}" text-anchor="middle" style="fill:#000;font-weight:900;font-size:12px">${n.open?'−':'+'}</text>`}</g>`}

VIEWS.res=(m,p)=>{const R=D.res,tab=p.tab||'top';const accL={G:'Gratuit',P:'Payant',M:'Non précisé'};
  const tbl=rows=>rows.map(r=>`<div class="res"><div class="small">${r.r}</div><div class="tiny mut">${esc(r.y)}</div><div class="small" style="margin-top:4px">${r.c}</div><div class="row tiny" style="margin-top:4px"><span class="acc ${r.g}">${esc(r.acc)}</span><span class="mut">· ${r.p}</span></div></div>`).join('');
  const T={top:['Essentiel',`<div class="card"><h3>Ordre d’utilisation conseillé</h3>${R.order.map(o=>`<p class="small">${o}</p>`).join('')}</div><div class="card"><h3>Entraînement (liens vérifiés)</h3>${R.train.map(r=>`<div class="res"><div class="small"><b>${esc(r.t)}</b> · <span class="acc ${/Payant/.test(r.g)?'P':/Gratuit|Extrait/.test(r.g)?'G':'M'}">${esc(r.g)}</span></div><a class="tiny" href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.u)}</a><div class="small mut">${esc(r.c)}</div></div>`).join('')}</div>`],
   cp:['Cas pratique',`<div class="card">${tbl(R.cp)}</div>`],qcm:['QCM',`<div class="card">${tbl(R.qcm)}</div>`],qrc:['QRC',`<div class="card">${tbl(R.qrc)}</div>`],oral:['Oral et FIR',`<div class="card">${tbl(R.oral)}${tbl(R.port)}</div>`],
   pdf:['Liens directs PDF',`<div class="card">${R.annex.map(a=>`<div class="res small"><b>${esc(a.t)}</b><br>${a.u.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ')}</div>`).join('')}</div>`],
   plus:['Pour aller plus loin',`<div class="card"><div class="small mut">QCM en ligne non recopiés (licence ou contenu commercial).</div>${R.plus.map(r=>`<div class="res"><b class="small">${esc(r.t)}</b><br><a class="tiny" href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.u)}</a><div class="small mut">${esc(r.c)}</div></div>`).join('')}</div>`]};
  m.innerHTML=`<h2>🔗 Ressources</h2><div class="small mut" style="margin-bottom:8px">Reprises des PDF « QCM_semestre1_IRA » et « Annales_IRA_ISP » (liens vérifiés le 17 octobre 2026). Les annales internes de la prépa IPAG ne sont pas publiques. Les liens demandent une connexion Internet.</div>
  <div class="seg">${Object.entries(T).map(([k,[l]])=>`<a class="${k===tab?'on':''}" href="#/res?tab=${k}">${l}</a>`).join('')}</div>${T[tab][1]}`};

  m.innerHTML=`<h2>🏅 Badges et succès</h2><div class="card"><h3>Rangs</h3><div class="grid g3">${LEVELS.map((x,i)=>`<div class="stat" style="${i+1===l.n?'border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.3)':i+1<l.n?'':'opacity:.5'}"><span class="tiny mut">Niveau ${i+1} · ${fmtN(x[0])} XP</span><b class="small">${TIER_ICON[x[1]]} ${x[1]} ${x[2]}</b></div>`).join('')}</div>
  <div class="tiny mut" style="margin-top:8px">Barème : +10 XP par bonne réponse (+12 en mode « Erreurs »), +2 XP par réponse fausse, +20 XP par session ; flash : +20 XP, +30 XP pour un sans-faute, +25 XP pour un record ; concours blanc : 200 XP + 10 XP par point ; copie notée : 150 XP (cas pratique) ou 80 XP (QRC) ; tâche cochée : +15 XP ; fiche, frise ou carte ouverte : +10 XP par jour ; quêtes : 30 à 250 XP ; badge : +50 XP.</div></div>

// ---------- Sauvegarde et réglages ----------
VIEWS.save=(m)=>{m.innerHTML=`<h2>💾 Sauvegarde et réglages</h2>
  ${STORAGE_OK?'':'<div class="banner warn">⚠️ Le navigateur refuse l’enregistrement local : exporte ta sauvegarde régulièrement.</div>'}
  <div class="card"><h3>Changer d’appareil</h3><div class="small mut">Ta progression est enregistrée dans ce navigateur (localStorage). Pour passer d’un appareil à l’autre : exporte le fichier JSON ici, envoie-le-toi (AirDrop, mail…), puis importe-le sur l’autre appareil. L’import remplace la progression actuelle.</div>
   <div class="grid g2" style="margin-top:10px"><button class="btn p" id="ex">⬇️ Exporter (fichier JSON)</button><button class="btn" id="cp">📋 Copier la sauvegarde</button>
   <label class="btn" style="position:relative;overflow:hidden">⬆️ Importer un fichier JSON<input type="file" accept=".json,application/json,text/plain" id="imf" style="position:absolute;inset:0;opacity:0"></label><button class="btn" id="imp">📥 Importer depuis le texte collé</button></div>
   <textarea id="imt" rows="3" style="margin-top:10px" placeholder="Colle ici le contenu d’une sauvegarde Top 1"></textarea>
   <div class="tiny mut" style="margin-top:6px">Sauvegarde actuelle : ${fmtN(JSON.stringify(S).length/1024)} Ko · ${S.ans.length} réponses · ${fmtN(S.xp)} XP.</div></div>
  <div class="card"><h3>Date des écrits</h3><div class="small mut">Par défaut : 1er avril 2027, hypothèse en attendant le calendrier officiel du concours ISP (attendu en janvier 2027). Mets à jour dès qu’il est publié.</div>
   <input type="date" id="exd" value="${S.set.exam}" style="margin-top:8px"><button class="btn" style="margin-top:8px" id="exs">Enregistrer la date</button></div>
  <div class="card"><h3>Réinitialiser</h3><button class="btn w" id="rs">Tout effacer</button></div>`;
  const dump=()=>JSON.stringify({app:'Top1',exported:new Date().toISOString(),save:S});
  $('#ex').onclick=()=>{const b=new Blob([dump()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='top1-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Sauvegarde exportée')};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(dump());toast('Sauvegarde copiée')}catch(e){$('#imt').value=dump();$('#imt').select();toast('Copie automatique impossible : le texte est sélectionné, copie-le')}};
  const imp=txt=>{try{const o=JSON.parse(txt),s=o.save||o;if(s.v!==1||!Array.isArray(s.ans))throw 0;if(!confirm('Remplacer ta progression actuelle par cette sauvegarde ?'))return;localStorage.setItem(KEY,JSON.stringify(s));S=load();toast('Sauvegarde importée');checkAll();render()}catch(e){toast('Fichier invalide')}};
  $('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)};$('#imp').onclick=()=>imp($('#imt').value);
  $('#exs').onclick=()=>{if($('#exd').value){S.set.exam=$('#exd').value;save();toast('Date enregistrée')}};
  $('#rs').onclick=()=>{if(confirm('Effacer toute la progression ? Pense à exporter avant.')){localStorage.removeItem(KEY);S=DEF();save();render()}}};
VIEWS.more=(m)=>{m.innerHTML=`<h2>☰ Menu</h2><div class="grid g2">${NAV.map(([v,i,l])=>`<a class="subj" style="--c:var(--neo);text-decoration:none;color:inherit" href="#/${v}"><span class="ic">${i}</span><b>${l}</b></a>`).join('')}</div>`};

  <div class="app"><nav class="side">${NAV.map(([v,i,l])=>`<a href="#/${v}" data-v="${v}"><span>${i}</span>${l}</a>`).join('')}</nav><main></main></div>

  <div id="toasts"></div><div id="lvlup" onclick="closeLvl()"><div class="box"><div class="mut">NIVEAU SUPÉRIEUR !</div><div class="ring">1</div><h1>Candidat</h1><p class="mut"></p><button class="btn p">Continuer</button></div></div><canvas id="confetti"></canvas>`);
  for(const k in S.views)if(k.startsWith('v_')&&k.slice(2,12)<addDays(today(),-3))delete S.views[k];
  window.addEventListener('hashchange',render);render();checkAll();setInterval(tickNotif,60000);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&window.TOP1_PWA)navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();
